<script>
  import { onMount } from "olum";
  import FileChip from "./FileChip";
  import ModelPicker from "./ModelPicker";
  import Button from "../ui/Button/Button";
  import Icon from "../ui/Icon/Icon";
  import Textarea from "../ui/Textarea/Textarea";
  import Toggle from "../ui/Toggle/Toggle";
  import Tooltip from "../ui/Tooltip/Tooltip";
  import TooltipContent from "../ui/Tooltip/TooltipContent";
  import TooltipTrigger from "../ui/Tooltip/TooltipTrigger";
  import { chat } from "../../utils/store";
  import { Brain, Mic, Paperclip, SendHorizontal, Square } from "../../utils/icons";

  // The message box: type, attach files, send (Enter) or stop.
  const state = { input: "", files: [], think: false };

  const field = () => host.querySelector("textarea");

  /* ---- sending ---- */

  const canSend = () => Boolean((state.input.trim() || state.files.length) && chat.model);

  const send = () => {
    const text = state.input.trim();
    if (!canSend() || chat.sending) return;
    chat.send(text, state.files, state.think);
    setInput("");
    state.files = [];
    historyIndex = null;
  };

  const sendOrStop = () => (chat.sending ? chat.stop() : send());
  const setThink = (on) => (state.think = on);

  // Placeholder for voice commands (not built yet).
  const startVoice = () => {};

  /* ---- typing ---- */

  const setInput = (value) => {
    state.input = value;
    const el = field();
    el.value = value;
    grow(el);
  };

  const onInput = (e) => {
    state.input = e.target.value;
    historyIndex = null; // editing a recalled prompt makes it the new draft
    grow(e.target);
  };

  // Grow with the text up to ~8 lines, then scroll. (CSS field-sizing isn't in NW.js's engine yet.)
  const grow = (el) => {
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, 200)}px`;
  };

  /* ---- files ---- */

  const pickFiles = () => host.querySelector('input[type="file"]').click();

  const addFiles = async (e) => {
    const picked = [...e.target.files];
    e.target.value = ""; // lets the same file be picked again
    const read = await Promise.all(picked.map(async (file) => ({ id: Math.random().toString(36).slice(2), name: file.name, content: await file.text() })));
    // Only text reaches the model, so binary files (images, archives…) are left out.
    state.files = [...state.files, ...read.filter((f) => !f.content.includes("\u0000"))];
  };

  const removeFile = (id) => (state.files = state.files.filter((f) => f.id !== id));

  /* ---- prompt history: Up/Down walk through what you sent in this chat, like a terminal ---- */

  let historyIndex = null; // null = not browsing
  let draft = ""; // what was typed before browsing started

  const sentPrompts = () => chat.messages.filter((m) => m.role === "user" && m.text).map((m) => m.text);

  const browseHistory = (up) => {
    const list = sentPrompts();
    const next = Math.min(historyIndex ?? list.length, list.length) + (up ? -1 : 1);
    if (next < 0 || next > list.length) return false;
    if (historyIndex === null) draft = state.input;
    historyIndex = next === list.length ? null : next;
    setInput(historyIndex === null ? draft : list[historyIndex]);
    return true;
  };

  // Textarea doesn't forward keydown, so it's attached to the field directly.
  onMount(() => {
    const el = field();
    const onKeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        // Only on the first line (Up) or last line (Down), so moving the caret in long text still works.
        const up = e.key === "ArrowUp";
        const caretText = up ? el.value.slice(0, el.selectionStart) : el.value.slice(el.selectionEnd);
        const plain = !e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey;
        if (plain && !caretText.includes("\n") && browseHistory(up)) e.preventDefault();
      }
    };
    el.addEventListener("keydown", onKeydown);
    el.focus();
    return () => el.removeEventListener("keydown", onKeydown);
  });
</script>

<div class="shrink-0 px-4 pb-3 sm:px-6">
  <div class="mx-auto w-full max-w-measure">
    <div
      data-slot="composer"
      class="rounded-[1.5rem] border border-border bg-background shadow-xl shadow-home-ink/[0.06] transition-[border-color,box-shadow] focus-within:border-home-ink/30 focus-within:ring-4 focus-within:ring-home-card-accent/25 dark:shadow-black/30"
    >
      <if when="state.files.length">
        <div class="flex flex-wrap gap-1.5 px-3 pt-3">
          <for each="f of state.files" key="f.id"><FileChip file="{f}" onremove="{removeFile}" /></for>
        </div>
      </if>

      <Textarea
        rows="1"
        placeholder="{chat.model ? 'Message ' + chat.current().label + '…' : 'No model available'}"
        class="max-h-[200px] min-h-0 resize-none rounded-none border-0 bg-transparent px-5 pt-4 pb-1 text-[15px] leading-relaxed shadow-none focus-visible:ring-0"
        value="{state.input}"
        oninput="{onInput}"
      />

      <div class="flex items-center gap-1 px-2.5 pt-1 pb-2.5">
        <Tooltip>
          <TooltipTrigger>
            <Button variant="ghost" size="icon-sm" class="size-9 rounded-full text-muted-foreground" ariaLabel="Attach a file" onclick="{pickFiles}">
              <Icon icon="{Paperclip}" class="size-[18px]" />
            </Button>
          </TooltipTrigger>
          <TooltipContent>Attach a file</TooltipContent>
        </Tooltip>

        <!-- <Tooltip>
          <TooltipTrigger>
            <Button variant="ghost" size="icon-sm" class="size-9 rounded-full text-muted-foreground" ariaLabel="Voice commands" onclick="{startVoice}">
              <Icon icon="{Mic}" class="size-[18px]" />
            </Button>
          </TooltipTrigger>
          <TooltipContent>Voice commands</TooltipContent>
        </Tooltip> -->


        <div class="flex-1"></div>

        <!-- Deep green with a lime arrow, like the home page's send button. -->
        <button
          type="button"
          class="grid size-10 cursor-pointer place-items-center rounded-full bg-home-ink text-home-ink-foreground shadow-md shadow-home-ink/20 transition-[translate,opacity] outline-none hover:-translate-y-0.5 focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-35 disabled:shadow-none"
          aria-label="{chat.sending ? 'Stop generating' : 'Send message'}"
          disabled="{!chat.sending && !canSend()}"
          onclick="sendOrStop()"
        >
          <Icon icon="{chat.sending ? Square : SendHorizontal}" class="{chat.sending ? 'size-3.5 [&_svg]:fill-current' : 'size-[18px] [&_svg]:fill-current'}" />
        </button>
      </div>
    </div>

    <!-- Under the box: keyboard hints on the left; Think and the model picker under the send button. -->
    <div class="mt-2 flex items-center gap-3 pl-2">
      <p class="hidden min-w-0 flex-1 truncate text-[11px] text-muted-foreground sm:block">
        <span class="font-mono">Enter</span> to send · <span class="font-mono">Shift+Enter</span> for a new line · <span class="font-mono">↑</span> for your last prompt
      </p>
      <div class="ml-auto flex shrink-0 items-center gap-1.5">
        <ModelPicker />
        <Toggle
          size="sm"
          class="h-8 gap-1.5 rounded-full border border-border bg-background px-3 text-[13px] text-muted-foreground hover:bg-muted aria-pressed:border-transparent aria-pressed:bg-home-tint aria-pressed:text-foreground"
          onchange="{setThink}"
        >
          <Icon icon="{Brain}" class="size-3.5" />
          Think
        </Toggle>
      </div>
    </div>

    <input type="file" multiple hidden onchange="addFiles($event)" />
  </div>
</div>
