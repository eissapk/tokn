<script>
  import Button from "../ui/Button/Button";
  import Icon from "../ui/Icon/Icon";
  import Logo from "../Logo";
  import Tooltip from "../ui/Tooltip/Tooltip";
  import TooltipContent from "../ui/Tooltip/TooltipContent";
  import TooltipTrigger from "../ui/Tooltip/TooltipTrigger";
  import ContextMeter from "./ContextMeter";
  import { chat } from "../../utils/store";
  import { PanelLeft, SquarePen } from "../../utils/icons";

  // Component tags take functions by name, so store actions get local wrappers.
  const newChat = () => chat.newChat();
  const toggleSidebar = () => chat.toggleSidebar();

  // Tooltips open upward by default, which would put them off the top of the window.
  const below = "top-full bottom-auto mt-2 mb-0 [&>div:last-child]:-top-1 [&>div:last-child]:bottom-auto";
  // The first button sits near the window's left edge, so its tooltip starts at the button instead of centring.
  const belowLeft = `${below} left-0 translate-x-0 [&>div:last-child]:left-[18px]`;
</script>

<header class="flex h-16 shrink-0 items-center gap-2 px-4">
  <Tooltip>
    <TooltipTrigger>
      <Button variant="ghost" size="icon-sm" class="size-9 rounded-xl text-muted-foreground" ariaLabel="Toggle chat history" onclick="{toggleSidebar}">
        <Icon icon="{PanelLeft}" class="size-[18px]" />
      </Button>
    </TooltipTrigger>
    <TooltipContent class="{belowLeft}">{chat.sidebar ? "Hide chats" : "Show chats"}</TooltipContent>
  </Tooltip>

  <div class="flex-1"></div>

  <if when="chat.messages.length && chat.current().context"><ContextMeter /></if>

  <if when="!chat.sidebar">
    <Tooltip>
      <TooltipTrigger>
        <Button variant="ghost" size="icon-sm" class="size-9 rounded-xl text-muted-foreground" ariaLabel="New chat (Ctrl+N)" onclick="{newChat}">
          <Icon icon="{SquarePen}" class="size-[18px]" />
        </Button>
      </TooltipTrigger>
      <TooltipContent class="{below}">New chat</TooltipContent>
    </Tooltip>
  </if>
</header>
