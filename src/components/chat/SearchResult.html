<script>
  import { props } from "olum";
  import CommandItem from "../ui/Command/CommandItem";
  import Icon from "../ui/Icon/Icon";
  import { chat } from "../../utils/store";
  import { snippetFor } from "../../utils/search";
  import { MessageSquare, Star } from "../../utils/icons";

  // One chat in the SearchDialog. Picking it opens that chat.
  const { session, query = "" } = props();

  const open = () => chat.openSession(session.id);
  // Where the match is, when it's inside a message rather than the title.
  const snippet = () => snippetFor(session, query);
</script>

<CommandItem onselect="{open}" class="items-start gap-3 rounded-xl px-3 py-2.5 text-left hover:bg-home-tint/60 data-[selected=true]:bg-home-tint">
  <Icon icon="{session.starred ? Star : MessageSquare}" class="mt-0.5 size-4 text-muted-foreground {session.starred ? '[&_svg]:fill-current' : ''}" />
  <span class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span class="w-full truncate font-medium">{session.title}</span>
    <if when="snippet()">
      <span class="line-clamp-2 text-xs text-muted-foreground">{snippet()}</span>
    </if>
  </span>
</CommandItem>
