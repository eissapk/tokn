<script>
  import { props } from "olum";
  import CommandItem from "../ui/Command/CommandItem";
  import { chat } from "../../utils/store";
  import { snippetFor } from "../../utils/search";

  // One chat in the SearchDialog. Picking it opens that chat.
  const { session, query = "" } = props();

  const open = () => chat.openSession(session.id);
  // Where the match is, when it's inside a message rather than the title.
  const snippet = () => snippetFor(session, query);
</script>

<CommandItem onselect="{open}" class="flex-col items-start gap-0.5 text-left">
  <span class="w-full truncate">{session.title}</span>
  <if when="snippet()">
    <span class="line-clamp-2 text-xs text-muted-foreground">{snippet()}</span>
  </if>
</CommandItem>
