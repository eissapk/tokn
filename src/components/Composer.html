<script>
  import { onMount } from "olum";
  import Icon from "./ui/Icon/Icon";
  import InputGroup from "./ui/InputGroup/InputGroup";
  import InputGroupAddon from "./ui/InputGroup/InputGroupAddon";
  import InputGroupButton from "./ui/InputGroup/InputGroupButton";
  import Textarea from "./ui/Textarea/Textarea";
  import Toggle from "./ui/Toggle/Toggle";
  import Tooltip from "./ui/Tooltip/Tooltip";
  import TooltipContent from "./ui/Tooltip/TooltipContent";
  import TooltipTrigger from "./ui/Tooltip/TooltipTrigger";
  import { chat } from "../utils/store";
  import { ArrowUp, Lightbulb, Mic, Paperclip } from "../utils/icons";

  const state = { input: "" };

  /* Stubs, one per control. Wire them up here; nothing else in the app calls
     them. onThink receives the toggle's new pressed state. */
  const onAttach = () => {};
  const onMic = () => {};
  const onThink = (pressed) => {};
  const onSend = () => {
    console.log(state.input);
    
  };
  const handleInput = (e) => {
    state.input = e.target.value;
    grow(e.target);
  };

  /* field-sizing: content isn't in every engine NW.js ships on, so the height
     is set by hand: reset, then take the content's own height up to a ceiling
     of roughly eight lines, after which the field scrolls. */
  const grow = (el) => {
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, 200)}px`;
  };

  /* Textarea doesn't forward keydown, so Enter-to-send is attached to the
     field it renders. */
  onMount(() => {
    const field = host.querySelector("textarea");
    if (!field) return;

    const onKeydown = (e) => {
      if (e.key !== "Enter" || e.shiftKey) return;
      e.preventDefault();
      onSend();
    };

    field.addEventListener("keydown", onKeydown);
    field.focus();

    return () => {
      field.removeEventListener("keydown", onKeydown);
    };
  });
</script>

<div class="shrink-0 pb-4">
  <!-- Same measure and the same 24px gutter as the transcript, so the field's
       edge lands exactly on the text edge above it. -->
  <div class="mx-auto w-full max-w-measure px-6">
    <InputGroup class="rounded-xl bg-background">
      <Textarea
        rows="1"
        slot="input-group-control"
        placeholder="Message {chat.model}"
        class="max-h-[200px] min-h-0 resize-none rounded-none border-0 bg-transparent px-3.5 pt-3 pb-1 text-[15px] leading-relaxed focus-visible:ring-0"
        oninput="{handleInput}"
        value="{state.input}"
      />

      <InputGroupAddon align="block-end" class="gap-1 px-2 pt-1 pb-2">
        <Tooltip>
          <TooltipTrigger>
            <InputGroupButton size="icon-sm" ariaLabel="Attach a file" onclick="{onAttach}">
              <Icon icon="{Paperclip}" class="size-4" />
            </InputGroupButton>
          </TooltipTrigger>
          <TooltipContent>Attach a file</TooltipContent>
        </Tooltip>

        <Tooltip>
          <TooltipTrigger>
            <InputGroupButton size="icon-sm" ariaLabel="Dictate a message" onclick="{onMic}">
              <Icon icon="{Mic}" class="size-4" />
            </InputGroupButton>
          </TooltipTrigger>
          <TooltipContent>Dictate a message</TooltipContent>
        </Tooltip>

        <Toggle size="sm" class="gap-1.5 text-muted-foreground aria-pressed:text-foreground" onchange="{onThink}">
          <Icon icon="{Lightbulb}" class="size-3.5" />
          Think
        </Toggle>

        <div class="flex-1"></div>

        <InputGroupButton variant="default" size="icon-sm" ariaLabel="Send message" onclick="{onSend}">
          <Icon icon="{ArrowUp}" class="size-4" />
        </InputGroupButton>
      </InputGroupAddon>
    </InputGroup>
  </div>
</div>
