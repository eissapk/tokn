<script>
  import Icon from "./ui/Icon/Icon";
  import { chat } from "../utils/store";
  import { ArrowUp } from "../utils/icons";

  /* Prompts about the thing in front of you. A local runner's first question
     is almost always about the runner -- memory, quantization, context -- so
     these are the real ones rather than "write me a poem". */
  const prompts = [
    "What does num_ctx change, and when is it worth raising?",
    "Write a Modelfile that turns qwen3 into a terse code reviewer",
    "Q4_K_M or Q5_K_M on a machine with 16 GB of RAM?",
    "Stream /api/chat from a Node script and print tokens as they arrive",
  ];

  const ask = (text) => {
    chat.setDraft(text);
    chat.send();
  };
</script>

<div class="mx-auto flex h-full w-full max-w-measure flex-col justify-center px-6 py-10">
  <!-- The one claim worth leading with. Every other chat client opens by
       introducing itself; this one opens by saying where your words go. -->
  <h2 class="font-display text-[26px] leading-tight font-bold tracking-tight text-balance">Nothing leaves this machine.</h2>
  <p class="mt-2 max-w-[46ch] text-[15px] leading-relaxed text-muted-foreground">
    <span class="font-mono text-foreground">{chat.model}</span> is
    <if when="chat.isLoaded(chat.model)">loaded and waiting</if>
    <else>installed and ready to load</else>
    — {chat.modelInfo().params}, {chat.modelInfo().quant}, {Math.round(chat.contextLimit() / 1024)}k of context. Ask it something.
  </p>

  <ul class="mt-8 border-t border-border">
    <for each="p of prompts" key="p">
      <li>
        <button
          onclick="ask(p)"
          class="group flex w-full items-center gap-4 border-b border-border py-3 text-left text-[14px] transition-colors outline-none hover:bg-muted/50 focus-visible:bg-muted/50 focus-visible:ring-2 focus-visible:ring-ring/50"
        >
          <span class="min-w-0 flex-1 pl-1 text-muted-foreground transition-colors group-hover:text-foreground">{p}</span>
          <Icon icon="{ArrowUp}" class="mr-1 size-3.5 rotate-45 text-muted-foreground opacity-0 transition-opacity group-hover:opacity-100" />
        </button>
      </li>
    </for>
  </ul>
</div>
