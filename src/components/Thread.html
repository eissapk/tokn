<script>
  import { onMount } from "olum";
  import MessageScroller from "./ui/MessageScroller/MessageScroller";
  import MessageScrollerButton from "./ui/MessageScroller/MessageScrollerButton";
  import MessageScrollerContent from "./ui/MessageScroller/MessageScrollerContent";
  import MessageScrollerItem from "./ui/MessageScroller/MessageScrollerItem";
  import MessageScrollerProvider from "./ui/MessageScroller/MessageScrollerProvider";
  import MessageScrollerViewport from "./ui/MessageScroller/MessageScrollerViewport";
  import ChatMessage from "./ChatMessage";
  import { chat } from "../utils/store";

  // Keep scrolled to the newest text while it streams, unless the reader has scrolled up.
  onMount(() => {
    const viewport = host.querySelector('[data-slot="message-scroller-viewport"]');
    let follow = true;

    const onScroll = () => (follow = viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight < 32);
    const observer = new MutationObserver(() => follow && (viewport.scrollTop = viewport.scrollHeight));

    viewport.addEventListener("scroll", onScroll, { passive: true });
    observer.observe(viewport, { childList: true, subtree: true, characterData: true });
    return () => {
      viewport.removeEventListener("scroll", onScroll);
      observer.disconnect();
    };
  });
</script>

<MessageScrollerProvider>
  <MessageScroller class="flex-1">
    <MessageScrollerViewport>
      <MessageScrollerContent class="mx-auto w-full max-w-measure gap-7 px-6 py-8">
        <for each="m of chat.messages" key="m.id">
          <MessageScrollerItem><ChatMessage message="{m}" /></MessageScrollerItem>
        </for>
      </MessageScrollerContent>
    </MessageScrollerViewport>
    <MessageScrollerButton />
  </MessageScroller>
</MessageScrollerProvider>
