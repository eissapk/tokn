<script>
  import Progress from "./ui/Progress/Progress";
  import { chat } from "../utils/store";

  // How much of the model's context window this chat uses. Turns amber past 80%.
  const used = () => chat.contextUsed();
  const limit = () => chat.current().context;
  const percent = () => Math.min(100, (used() / limit()) * 100);
  const short = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n));
</script>

<div class="hidden items-center gap-2 sm:flex" title="Context used by this conversation">
  <span class="text-[11px] text-muted-foreground">Context</span>
  <Progress
    value="{percent()}"
    class="w-16 {percent() >= 80 ? '[&_[data-slot=progress-indicator]]:bg-warn' : '[&_[data-slot=progress-indicator]]:bg-muted-foreground'}"
  />
  <span class="tnum font-mono text-[11px] text-muted-foreground">{short(used())}/{short(limit())}</span>
</div>
