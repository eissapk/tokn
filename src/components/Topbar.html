<script>
  import Button from "./ui/Button/Button";
  import DropdownMenu from "./ui/DropdownMenu/DropdownMenu";
  import DropdownMenuContent from "./ui/DropdownMenu/DropdownMenuContent";
  import DropdownMenuLabel from "./ui/DropdownMenu/DropdownMenuLabel";
  import DropdownMenuSeparator from "./ui/DropdownMenu/DropdownMenuSeparator";
  import DropdownMenuTrigger from "./ui/DropdownMenu/DropdownMenuTrigger";
  import Icon from "./ui/Icon/Icon";
  import ContextMeter from "./ContextMeter";
  import ModelOption from "./ModelOption";
  import { chat } from "../utils/store";
  import { OLLAMA_URL } from "../utils/ollama";
  import { ChevronDown, Moon, PanelLeft, SquarePen, Sun } from "../utils/icons";

  // Component tags take functions by name, so store actions get local wrappers.
  const newChat = () => chat.newChat();
  const toggleTheme = () => chat.toggleTheme();
  const toggleSidebar = () => chat.toggleSidebar();

  const online = () => chat.server === "connected";
</script>

<header class="flex h-14 shrink-0 items-center gap-3 border-b border-border px-4">
  <Button variant="ghost" size="icon-sm" class="-ml-1.5 text-muted-foreground" ariaLabel="Toggle chat history" onclick="{toggleSidebar}">
    <Icon icon="{PanelLeft}" class="size-4" />
  </Button>

  <!-- Green dot = the local Ollama server is reachable. -->
  <span
    class="size-1.5 shrink-0 rounded-full {online() ? 'bg-signal' : 'bg-muted-foreground'}"
    title="{online() ? 'Connected to the local server' : 'No local server'}"
  ></span>
  <h1 class="font-display hidden text-[15px] leading-none font-bold tracking-tight lowercase sm:block">Buildr</h1>
  <span class="hidden h-5 w-px bg-border sm:block"></span>

  <!-- Model picker -->
  <DropdownMenu>
    <DropdownMenuTrigger class="rounded-lg outline-none focus-visible:ring-3 focus-visible:ring-ring/50">
      <span class="flex items-center gap-2 rounded-lg px-2 py-1.5 transition-colors hover:bg-muted">
        <if when="chat.model"><span class="font-mono text-sm font-medium">{chat.current().label}</span></if>
        <else><span class="text-sm text-muted-foreground">{chat.server === "connecting" ? "Loading models…" : "No models"}</span></else>
        <Icon icon="{ChevronDown}" class="size-3.5 text-muted-foreground" />
      </span>
    </DropdownMenuTrigger>

    <DropdownMenuContent class="w-96 p-1.5">
      <DropdownMenuLabel class="px-2 pt-1 pb-2">Installed models</DropdownMenuLabel>
      <DropdownMenuSeparator />
      <for each="m of chat.models" key="m.name"><ModelOption model="{m}" /></for>
      <if when="!chat.models.length">
        <p class="px-2 py-3 text-[13px] text-muted-foreground">
          {chat.server === "offline" ? "Can't reach the server at " + OLLAMA_URL : "No models installed"}
        </p>
      </if>
    </DropdownMenuContent>
  </DropdownMenu>

  <div class="flex-1"></div>

  <if when="chat.messages.length && chat.current().context"><ContextMeter /></if>

  <Button variant="ghost" size="sm" class="gap-1.5 text-muted-foreground" onclick="{newChat}">
    <Icon icon="{SquarePen}" class="size-3.5" />
    New chat
  </Button>

  <Button variant="ghost" size="icon-sm" ariaLabel="Toggle dark theme" onclick="{toggleTheme}">
    <Icon icon="{chat.theme === 'dark' ? Sun : Moon}" class="size-4" />
  </Button>
</header>
