<script>
  import { props } from "olum";
  import Button from "./ui/Button/Button";
  import Icon from "./ui/Icon/Icon";
  import { chat } from "../utils/store";
  import { Star, Trash2 } from "../utils/icons";

  // One saved chat in the Sidebar.
  const { session } = props();

  const open = () => chat.openSession(session.id);
  const star = () => chat.toggleStar(session.id);
  const remove = () => chat.removeSession(session.id);
  const isOpen = () => session.id === chat.sessionId;

  // Time for today's chats, the date for older ones.
  const when = () => {
    const date = new Date(session.updatedAt);
    return date.toDateString() === new Date().toDateString()
      ? date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : date.toLocaleDateString([], { month: "short", day: "numeric" });
  };

  // The buttons show on hover; a starred chat always shows its (filled) star.
  const reveal = "opacity-0 group-hover:opacity-100 focus-visible:opacity-100";
</script>

<div class="group flex items-center gap-0.5 rounded-lg pr-1.5 {isOpen() ? 'bg-muted text-foreground' : 'text-muted-foreground hover:bg-muted hover:text-foreground'}">
  <button
    type="button"
    class="flex min-w-0 flex-1 cursor-pointer flex-col items-start gap-0.5 rounded-lg px-2.5 py-2 text-left outline-none focus-visible:ring-3 focus-visible:ring-ring/50"
    title="{session.title}"
    onclick="open()"
  >
    <span class="w-full truncate text-[13px]">{session.title}</span>
    <span class="tnum text-[11px] text-muted-foreground">{when()}</span>
  </button>

  <Button variant="ghost" size="icon-xs" ariaLabel="{session.starred ? 'Unstar chat' : 'Star chat'}" class="hover:bg-background {session.starred ? '' : reveal}" onclick="{star}">
    <Icon icon="{Star}" class="size-3.5 {session.starred ? '[&_svg]:fill-current' : ''}" />
  </Button>
  <Button variant="ghost" size="icon-xs" ariaLabel="Delete chat" class="hover:bg-background {reveal}" onclick="{remove}">
    <Icon icon="{Trash2}" class="size-3.5" />
  </Button>
</div>
