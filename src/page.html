<head>
  <title>ollama — local chat</title>
  <meta name="description" content="A desktop client for models running on your own machine." />
</head>

<script>
  import { onMount } from "olum";
  import TooltipProvider from "./components/ui/Tooltip/TooltipProvider";
  import Composer from "./components/Composer";
  import Thread from "./components/Thread";
  import Topbar from "./components/Topbar";
  import { chat, restoreTheme } from "./utils/store";

  onMount(() => {
    restoreTheme();

    /* Nothing is saved, so the only shortcut worth having is the one that
       throws the current thread away and starts over. It lives on window so
       it works wherever the focus happens to be. */
    const onKey = (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.key !== "n") return;
      e.preventDefault();
      chat.clear();
    };

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
</script>

<TooltipProvider>
  <div class="flex h-screen w-screen flex-col overflow-hidden bg-background text-foreground">
    <Topbar />
    <Thread />
    <Composer />
  </div>
</TooltipProvider>
